name: Update Kaden sale site

on:
  # 定期実行は GitHub の schedule をやめ、Google Cloud Scheduler から
  # workflow_dispatch API を叩く方式に移行した (2026-08-29)。
  #
  # 理由: GitHub の schedule は高負荷時に発火そのものをスキップする。
  # 2026-08-22〜29 の実測で、公称「毎時」に対し中央値は60分と近いものの
  # 最長13.3時間の欠測があり、3サイト(家電/電書/林檎ポチ)で同時刻に
  # 同じ穴が空いていた。ワークフロー自体の失敗は0件で、GitHub側の間引きが
  # 原因と確定している。workflow_dispatch はこの間引きの対象外。
  #
  # 発火元: Cloud Scheduler ジョブ kaden-pochi-update
  #         (GCPプロジェクト manga-rss / asia-northeast1 / cron "7 * * * *" UTC)
  #
  # **間隔を変えたら config.json の文言も必ず直すこと。**
  # サイトのヘッダーと「〜について」セクションに更新頻度を書いており
  # （config.json の site_description と about）、cronだけ変えると表示が
  # 嘘になる。実際2026-08時点で、3サイトとも「1時間ごと」と表示しながら
  # 実態は家電2時間・電書6時間・林檎30分とすべて食い違っていた。
  # 間隔は毎時。Creators API の上限8,640req/日を電書ポチ
  # (Partner Tag は natafull-22 で共通)と共有している点に注意すること。
  # 本ワークフローは170req/回なので 24回/日 = 4,080req。電書ポチ(2時間間隔・
  # 175req/回で 12回/日 = 2,100req)と合算して 6,180req/日、上限の71.5%。
  # 余力は約2,460req/日(手動実行14回分)ある。両方を毎時にすると8,280req(96%)で
  # 手動実行が1回混ざるだけで超えるため、電書ポチ側は2時間より短くしないこと。
  # ※ schedule を消したので、間隔を変えたいときはこのファイルではなく
  #   Cloud Scheduler 側のジョブを直すこと。
  #
  # 人手でconfig.jsonやスクリプトを変えたとき、次の定時実行(最大1時間後)を
  # 待たずに公開されるようにする。docsはアーティファクトで配信しており
  # コミットしていないため、pushトリガーを付けても本ワークフロー自身の
  # コミット(data/item_state.jsonのみ)では発火せずループしない
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write  # item_state.json(商品の初検出日)のコミットに必要
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策: アクションはタグでなくコミットSHAで固定する
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch sale data from Creators API
        env:
          CREATORSAPI_CREDENTIAL_ID: ${{ secrets.CREATORSAPI_CREDENTIAL_ID }}
          CREATORSAPI_CREDENTIAL_SECRET: ${{ secrets.CREATORSAPI_CREDENTIAL_SECRET }}
          CREATORSAPI_PARTNER_TAG: ${{ secrets.CREATORSAPI_PARTNER_TAG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/fetch_deals.py

      - name: Generate site
        run: python scripts/generate_site.py

      # 商品の初検出日を毎時実行をまたいで永続化する。
      # pushトリガーは設定していないのでループはしない
      - name: Persist item state
        run: |
          set -euo pipefail
          git add data/item_state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "商品の初検出日を更新 [bot]"
            # 再生成されたsales.json/docsが未ステージで残っていても
            # rebaseできるようautostashを使う
            git pull --rebase --autostash origin main
            # マーカーが混入したまま公開されると全商品の初検出日が
            # 失われるため、push前に必ず確認する(林檎ポチと同じ防御)
            if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/; then
              echo "::error::コンフリクトマーカーを検出したため中止します"
              exit 1
            fi
            git push
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
